name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        env:
          AMOCRM_SUBDOMAIN: example
          AMOCRM_CLIENT_ID: dummy
          AMOCRM_CLIENT_SECRET: dummy
          AMOCRM_REDIRECT_URI: https://localhost
        run: pytest -q
